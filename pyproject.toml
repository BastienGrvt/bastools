[project]
name = "bastools"
version = "0.1.1"
description = "Personal Python utilities for scientific plotting, formatting and data handling"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<4"
authors = [{ name = "Bastien Grivet", email = "73183679+BastienGrvt@users.noreply.github.com" }]
dependencies = [
    "matplotlib>=3.10.3,<4",
    "numpy>=2.3.1,<3",
    "tqdm>=4.67.1,<5",
    "scipy>=1.16.1,<2",
    "rich>=14.1.0,<15",
    "svgwrite>=1.4.3,<2",
]

[project.urls]
Homepage = "https://github.com/BastienGrvt/bastools"
Issues = "https://github.com/BastienGrvt/bastools/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bastools"]
